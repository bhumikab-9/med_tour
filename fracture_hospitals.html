<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fracture Hospitals - MedTour India</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .loading { text-align: center; padding: 50px; font-size: 18px; color: var(--muted); }
        .error { color: red; text-align: center; padding: 50px; }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo"><span>+</span> MedTour India</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="treatments.html">Treatments</a>
            <a href="hospitals.html">Hospitals</a>
        </nav>
    </header>

    <section class="page-header">
        <p class="small-title">ORTHOPEDIC</p>
        <h1>Fracture Treatment Hospitals</h1>
        <p>Comprehensive fracture care and rehabilitation by top specialists.</p>
    </section>

    <section class="treatment-section">
        <div class="treatment-list" id="hospitalList">
            <div class="loading">Fetching hospitals from database...</div>
        </div>
    </section>

    <script>
        fetch('http://localhost:5000/api/treatment-hospitals?ids=4')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('hospitalList');
                if (!data || data.length === 0) {
                    list.innerHTML = '<div class="loading">No hospitals found for this treatment.</div>';
                    return;
                }
                list.innerHTML = '';
                data.forEach(h => {
                    const card = document.createElement('div');
                    card.className = 'treatment-item';
                    const costStr = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(h.cost);
                    card.innerHTML = `
                        <div class="treatment-image" style="background: #edf5fb; font-size:50px;">🏥</div>
                        <div class="treatment-info">
                            <p class="treatment-category">${h.location}</p>
                            <h2>${h.hospital_name}</h2>
                            <p>${h.description}</p>
                            <div class="treatment-details">
                                <span>📍 ${h.location}</span>
                                <span>💰 ${costStr}</span>
                            </div>
                            <button class="card-button" onclick="alert('Consultation booking coming soon!')">Book Consultation</button>
                        </div>
                    `;
                    list.appendChild(card);
                });
            })
            .catch(err => {
                document.getElementById('hospitalList').innerHTML = '<div class="error">Failed to load from database. Is the server running?</div>';
                console.error(err);
            });
    </script>
</body>
</html>
