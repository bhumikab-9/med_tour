<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospitals - MedTour India</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .loading { text-align: center; padding: 50px; font-size: 18px; color: var(--muted); }
        .error { color: red; text-align: center; padding: 50px; }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-icon">+</span>
            <span>MedTour<span class="logo-india">India</span></span>
        </a>
        <nav class="nav-links">
            <a href="treatments.html">Treatments</a>
            <a href="hospitals.html">Hospitals</a>
            <a href="appointment.html">Book</a>
        </nav>
    </header>

    <section class="page-header">
        <p class="small-title" id="pageCategory">HOSPITALS</p>
        <h1 id="pageTitle">Treatment Hospitals</h1>
        <p id="pageSubtitle">Top hospitals offering this treatment in India.</p>
    </section>

    <section class="treatment-section">
        <div class="treatment-list" id="hospitalList">
            <div class="loading">Fetching hospitals from database...</div>
        </div>
    </section>

    <footer>
        <div class="footer-main">
            <div class="footer-brand">
                <a href="index.html" class="logo footer-logo">
                    <span class="logo-icon">+</span>
                    <span>MedTour<span class="logo-india">India</span></span>
                </a>
                <p>Making healthcare discovery simpler, clearer and more accessible.</p>
            </div>
        </div>
        <div class="footer-bottom" style="margin-top:40px;border-top:1px solid rgba(255,255,255,0.1);padding-top:20px;text-align:center;">
            <span>&copy; 2026 MedTour India</span>
        </div>
    </footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const treatmentId = params.get('id');
        const treatmentName = params.get('name') || 'Treatment';

        document.getElementById('pageTitle').textContent = treatmentName + ' Hospitals';
        document.getElementById('pageSubtitle').textContent = 'Top hospitals offering ' + treatmentName + ' in India.';
        document.title = treatmentName + ' Hospitals - MedTour India';

        if (!treatmentId) {
            document.getElementById('hospitalList').innerHTML = '<div class="error">No treatment specified.</div>';
        } else {
            fetch('http://localhost:5000/api/treatment-hospitals?ids=' + treatmentId)
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('hospitalList');
                    if (!data || data.length === 0) {
                        list.innerHTML = '<div class="loading">No hospitals found for this treatment.</div>';
                        return;
                    }
                    list.innerHTML = '';
                    data.forEach(h => {
                        const card = document.createElement('div');
                        card.className = 'treatment-item';
                        const costStr = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(h.cost);
                        const hospitalName = h.hospital_name;
                        card.innerHTML = '<div class="treatment-image" style="background:#edf5fb;font-size:50px;">&#127973;</div><div class="treatment-info"><p class="treatment-category">' + h.location + '</p><h2>' + hospitalName + '</h2><p>' + h.description + '</p><div class="treatment-details"><span>&#128205; ' + h.location + '</span><span>&#128176; ' + costStr + '</span></div><button class="card-button" onclick="window.location.href=\'appointment.html?hospital=\' + encodeURIComponent(\'' + hospitalName + '\') + \'&treatment=\' + encodeURIComponent(\'' + treatmentName + '\')">Book Consultation</button></div>';
                        list.appendChild(card);
                    });
                })
                .catch(err => {
                    document.getElementById('hospitalList').innerHTML = '<div class="error">Failed to load from database. Is the server running?</div>';
                    console.error(err);
                });
        }
    </script>
</body>
</html>
